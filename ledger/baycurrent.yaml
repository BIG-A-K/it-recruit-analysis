  - id: recruit-job-content
    phase: recruit
    store: mdx
    topic: 職種ごとの仕事内容・応募資格・配属・選考区分・勤務地
    status: done
    value: 2027年卒・2028年卒とも3職種で同一（2028年卒は3職種目の見出しのみビジネスサポート職）。(1)コンサルタント職＝リーディングカンパニーの経営課題を戦略・業務・デジタル等あらゆる領域で、戦略立案から企画・実行支援まで総合的に支援。(2)システムコンサルタント職＝経営課題をITで解決、システム開発の様々なフェーズ・領域のプロジェクトに参画。(3)コンサルタントサポート職＝コンサルタントのプロジェクトチームまたは本社セールス・リクルーティングチームでプロジェクト推進を支援。全職種正社員（期間の定めなし）。応募資格・配属・勤務地は募集要項に記載なし
    subject: 新卒採用（2027年卒・2028年卒、3職種）
    as_of: "2026-08-15"
    unit: ""
    source: https://www.baycurrent.co.jp/careers/newgraduate/newgraduate27/ ; https://www.baycurrent.co.jp/careers/newgraduate/newgraduate28/ ; https://www.baycurrent.co.jp/careers/ ; https://www.baycurrent.co.jp/aboutus/office/
