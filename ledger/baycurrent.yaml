  - id: segments-services
    phase: segments
    store: mdx
    topic: 報告セグメントごとの具体的なサービス名・提供内容・運営法人
    status: done
    value: 報告セグメントは「コンサルティング事業」の単一セグメント（有報S100Y69Gに「コンサルティング事業の単一セグメントであるため、セグメント別の記載をしておりません」と明記、3箇所で一致）。提供内容は戦略・デジタル・オペレーションなど幅広いテーマを支援する総合コンサルティングファームで、全社戦略・事業戦略の立案からデジタル技術を活用したビジネスオペレーションの検討・実行支援まで（ニュートラルな立場、横断型の柔軟な組織、特定企業・系列グループ非所属が特徴）。公式サイトのサービス分野は23区分（ERP／AI／トランスフォーメーション／サステナビリティ・GX／経営戦略＆コーポレートファイナンス／カスタマーエクスペリエンス／デジタルテクノロジー／データアナリティクス／テクノロジーイノベーション／グローバルビジネス／マーケティング＆セールス／M&A／サプライチェーン＆オペレーション／インテリジェント・オートメーション／人材・組織／コストマネジメント／エンジニアリング＆マニュファクチャリング／クラウド／デジタルコマース／インフラストラクチャ／セキュリティ／マネージドサービス）。運営法人：2024年9月1日の持株会社体制移行後は、株式会社ベイカレント・コンサルティング（コンサルティング事業、「経営、オペレーション、ITに関するコンサルティング、および実行支援」）と株式会社ベイカレント・テクノロジー（ITサービス事業、「システムコンサルティング、およびシステムインテグレーション」）の2事業会社が担う（いずれも100%所有の特定子会社）
    subject: 連結（コンサルティング事業単一セグメント）
    as_of: 2026-02-28時点の有報記載（確認日 2026-08-15）
    unit: ""
