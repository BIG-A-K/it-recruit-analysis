  - id: segments-services
    phase: segments
    store: mdx
    topic: 報告セグメントごとの具体的サービス・ブランド・提供内容・運営法人
    status: done
    value: |
      日本IBM公式サイトの事業カテゴリは法定報告セグメントではなく、国内向けの事業・サービス分類である。ソフトウェアはAI、生産性向上、データ管理、セキュリティー・ガバナンス、統合・レジリエンス、ハイブリッドインフラ管理を扱い、watsonx Orchestrate、watsonx.data、watsonx.governance、webMethods Hybrid Integration、IBM Concert等を含む。インフラストラクチャーはIBM Z、IBM Power、IBM Cloud Paks、IBM Cloud、ストレージ、ハイブリッドクラウド、アプリケーション・モダナイゼーションを扱う。IBM Consultingはデータ・AI、事業変革、サプライチェーン、財務、クラウド、アプリケーション、BPO、セキュリティーを助言・設計・構築・運用まで支援する。サイバーセキュリティーはX-Force、CyberDefend、脅威管理、GRC、マネージド・セキュリティー等を含む。戦略的パートナーシップ、Red Hatも公式サイト上の分類である。IJDS、ISE、ISOC、IJCC等の運営法人の役割は関連企業項目に分ける。
    subject: 日本アイ・ビー・エム株式会社
    as_of: 2026-08-06
    unit: ""
    source: >-
      https://www.ibm.com/jp-ja/about; https://www.ibm.com/jp-ja/software; https://www.ibm.com/jp-ja/solutions/infrastructure-modernization; https://www.ibm.com/jp-ja/consulting; https://www.ibm.com/jp-ja/services/security
