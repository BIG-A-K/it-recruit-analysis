  - id: recruit-jobs
    phase: recruit
    store: mdx
    topic: 職種ごとの仕事内容・応募資格・配属・選考区分・勤務地
    status: done
    value: |
      2028年度の確認済み募集職種は7職種。
      - 戦略コンサルタント：経営・事業・IT/AI戦略の構想策定、経営層への提言、変革推進。東京配属が基本で、東京・大阪・愛知等の事業所、顧客先、サテライトオフィス、自宅等。
      - デジタルビジネスコンサルタント：生成AI、IoT、ブロックチェーン、クラウド、ERP等を用いた業務・IT変革。勤務地は東京・大阪・愛知等。
      - ITスペシャリスト（コンサルティング事業本部）：要件定義、設計、構築、保守・運用までのITソリューション提供。勤務地は東京・大阪・愛知等。
      - ITスペシャリスト（テクノロジー事業本部）：AI・クラウド、データ管理・分析、自動化、ハイブリッドクラウド、IBM製品等の技術サービス。勤務地は東京・千葉等。海外大学卒・秋卒等の2027年既卒者も応募対象。
      - AIイノベーター：生成AIの構想設計、プロトタイプ開発、モデル評価、システム実装。AIの学習・検証経験およびPython等の開発成果物が必須。勤務地は東京等。
      - データサイエンティスト：AI・機械学習・数理最適化を用いたデータ分析。機械学習・数理最適化の知識または経験は望ましい。勤務地は東京・大阪・愛知等。
      - デザイナー：Web・モバイル等のUI/UX、ユーザー調査、プロトタイプ作成。デザイン等の知識・経験およびポートフォリオが必要。勤務地は東京・大阪・愛知等。
      共通して2028年4月または10月からの国内フルタイム就労、日本語能力、英語能力または習得意思、就業経験不問（一部の経験・成果物要件を除く）。選考はオンライン応募、書類選考、職種に応じたオンライン・コーディング・ビデオ・英語アセスメント、面接、結果連絡。FAQでは同時応募は1職種のみ。職種別の選考日程・期限は公開資料に記載なし。
    subject: 2028年度新卒採用・現行7職種
    as_of: 2026-08-06
    unit: ""
    source: >-
      https://www.ibm.com/jp-ja/careers/career-opportunities; https://www.ibm.com/jp-ja/careers/blog/2028-new-graduate-recruiting-positions.html; https://www.ibm.com/jp-ja/careers/application-process; https://www.ibm.com/jp-ja/careers/faq; https://www.ibm.com/downloads/documents/jp-ja/1227c12efab8b261; https://www.ibm.com/downloads/documents/jp-ja/1227c12efab8b265; https://www.ibm.com/downloads/documents/jp-ja/1227c12efab8b263; https://www.ibm.com/downloads/documents/jp-ja/16ddd5a57a3948f7; https://www.ibm.com/downloads/documents/jp-ja/15db805fff4249c9; https://www.ibm.com/downloads/documents/jp-ja/1227c12efab8b25d; https://www.ibm.com/downloads/documents/jp-ja/1227c12efab8b25f
    via: IBM公式の現行募集ページ、職種紹介ページ、7件の2028年度募集要項、応募プロセス、FAQを確認
    note: 現行ページにあるインフラストラクチャー・サービス・エンジニアのリンク先は2027年度募集要項のため、2028年度職種には含めない。ソリューションエンジニア、製品開発エンジニア、セールス、研究員は2028年度採用未定。
