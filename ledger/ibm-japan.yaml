  - id: segments-related-companies
    phase: segments
    store: mdx
    topic: 親会社・主な子会社と各社の事業内容
    status: done
    value: |
      直接株主はIBM Japan Holdings合同会社（100%）。日本IBM公式一覧の100%子会社はIJCC（IT製品・ソリューションのリース・ファイナンシング）、IJDS（情報システムの企画・設計・開発・保守・運用）、IJS（IBM BigBlue等のスポーツ事業）、ISE（DX・AI・ハイブリッドクラウド・インフラ技術サービス）、ISOC（シェアードサービス・バックオフィス・BPO）。50超〜99%区分にはIJDI、コベルコシステム、MIDS、りそなデジタル・アイ、TLIがあり、20〜50%区分にはCLIS、NTTインテグレーション（旧NI+C）、菱友システムビジネスがある。IJDIはJTB向けシステム、コベルコシステムはSI・ERP・DX、MIDSはみずほ金融システム、りそなデジタル・アイは金融システム、TLIは生命保険システム、CLISは保険・金融システム、NTTインテグレーションはクラウド・ネットワーク・セキュリティー・運用保守、菱友システムビジネスはITサポート・サイバーセキュリティー・保守を扱う。
    subject: 日本アイ・ビー・エム株式会社の株主・子会社・関連会社
    as_of: 2026-08-06
    unit: ""
    source: >-
