  - id: segments-services
    phase: segments
    store: mdx
    topic: 報告セグメントごとの具体的サービス名・ブランド名・提供内容・運営法人
    status: done
    value: |
      公式サイトのサービス区分は、インターネットサービスセグメント、フィンテックセグメント、モバイルセグメント、グループヘッドクオーター。
      インターネットサービスは、コマース・マーケティング（楽天市場、Rakuten Fashion、楽天ブックス、Rakuten 24、楽天ラクマ、楽天トラベル、楽天Car、楽天GORA、楽天マガジン、楽天ビューティ、Rakuten TV、Rakuten Music、楽天チケット、楽天マート、楽天スーパーロジスティクス等）、広告・メディア（楽天インサイト、リンクシェア、Rakuten Marketing Platform、楽天データマーケティング、楽天データソリューションズ、楽天レシピ、楽天Infoseek等）、国際・スポーツ（Rakuten Advertising、Rakuten VIKI、Rakuten Viber、楽天Kobo、Rakuten、Rakuten France、Rakuten TV Europe、ヴィッセル神戸、東北楽天ゴールデンイーグルス等）。主な主体は楽天グループ株式会社、楽天インサイト株式会社、リンクシェア・ジャパン株式会社、楽天データマーケティング株式会社、Rakuten Marketing LLC、Viki, Inc.、Viber Media S.a.r.l.、Rakuten Kobo Inc.、楽天ヴィッセル神戸株式会社、株式会社楽天野球団等。
      フィンテックは、決済・ポイント（楽天ペイ、楽天ポイントカード、楽天Edy、楽天チェック）、金融（楽天カード、楽天銀行、楽天証券、楽天ウォレット、楽天保険の総合窓口、楽天生命、楽天損保、楽天ペット保険等）。主な主体は楽天ペイメント株式会社、楽天Edy株式会社、楽天カード株式会社、楽天銀行株式会社、楽天証券株式会社、楽天ウォレット株式会社、楽天インシュアランスプランニング株式会社、楽天生命保険株式会社、楽天損害保険株式会社等。
      モバイルは、楽天モバイル株式会社のMNO・MVNO、楽天コミュニケーションズ株式会社の電話・IP通信、Rakuten Symphony Singapore, Pte. Ltd.のOpen RAN・クラウド・自動化等。グループヘッドクオーターは総務・人事・財務・法務等の本社機能、開発、戦略・マーケティング、新サービス開発を担い、楽天ドローン、楽天キャピタル、楽天トータルソリューションズ等を掲載する。
