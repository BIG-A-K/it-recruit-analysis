  - id: segments-mapping
    phase: segments
    store: mdx
    topic: 公式サイト事業区分とIR報告セグメントの対応と差異
    status: done
    value: |
      FY2023〜FY2025の有価証券報告書と現行IRページの法定報告セグメントは「インターネットサービス」「フィンテック」「モバイル」の3区分。公式サイトのインターネットサービス、フィンテック、モバイルはそれぞれ同名の法定報告セグメントへ対応する。
      公式サイト内のコマース・マーケティング、広告・メディア、国際・スポーツ、決済、ポイント、銀行、証券、保険、携帯、通信プラットフォーム等は社内事業区分であり、法定報告上の独立セグメントではない。グループヘッドクオーターは本社機能・開発・新サービス等のウェブサイトカテゴリで、法定報告セグメントではない。
      70超のサービスや各ブランドについて、ブランド単位の売上・利益・セグメント帰属は開示されていないため独自配賦しない。2026年10月1日効力発生予定のフィンテック事業再編は確認日現在の将来計画であり、現行の3報告セグメントへ反映しない。
