  - id: recruit-salary
    phase: recruit
    store: mdx
    topic: 職種ごとの基準給与・基礎給・固定時間外手当・賞与・諸手当・標準年収
    status: done
    value: |
      ビジネス職4コース共通は学部卒月給350,000円、院卒月給360,000円。学部卒の内訳例は基本給265,823円＋40時間分の固定残業代84,177円、40時間超は別途支給。院卒の内訳は非開示。賞与は6月・12月に会社業績・個人業績に基づき支給、昇給は1月・7月。通勤手当は月額上限50,000円。標準年収・想定年収・賞与額は非開示で、月給の単純年換算はしない。
      エンジニア職は月額370,000円以上。月額370,000円の内訳例は基本給281,013円＋40時間分の固定残業代88,987円、40時間超は別途支給。給与は専門知識・経験・実力により決定し、標準年収・職種別賞与額は非開示。通勤手当は条件・上限あり。企画業務型または専門業務型裁量労働制の対象となる場合がある。
      楽天銀行・楽天ペイメントのエンジニアカードに親会社共通条件が適用されるか、カードごとの給与差・賞与・標準年収は明記されていない。
