  - id: recruit-conditions
    phase: recruit
    store: mdx
    topic: 転勤・リモート勤務・標準労働時間・応募期限
    status: done
    value: |
      ビジネス職は本社（東京都世田谷区玉川1-14-1 楽天クリムゾンハウス）ほか各事業所。全国・海外への配置転換・転勤の可能性があり、一部在宅勤務を認める場合がある。所定労働時間7.5時間、休憩1時間、9:00〜17:30。朝会実施日は8:00〜16:30。フレキシブルタイムは7:00〜11:00・15:00〜20:00、コアタイムは11:00〜15:00。朝会日は7:00〜8:00・12:00〜20:00、コアタイム8:00〜12:00。新卒研修中はフレックス適用なし。2026年10月または2027年4月入社向けの締切は2026年4月21日8:59、2027年10月以降入社向けの締切は未掲載。選考中にTOEIC800未満の場合は受験案内があり、内定者は入社前にTOEIC800点または同等資格が必要。
      エンジニア職は東京本社、国内・海外支社等で勤務の可能性があり、個別カードの初期勤務地は楽天クリムゾンハウス、東京都内オフィス、NBF品川タワー、新潟県長岡市内。一般的な在宅勤務可否は記載なし。標準勤務時間は9:00〜17:30、所定労働時間7.5時間、休憩1時間。カードにより裁量労働制またはフレックスタイム制、コアタイム11:00〜15:00。2027年入社向けは募集終了、2028年本選考の期限は未掲載。2028年夏季インターンシップも全件募集終了。
