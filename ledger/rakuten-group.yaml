  - id: recruit-employing-entity
    phase: recruit
    store: mdx
    topic: 採用主体・募集年度・確認日・募集ページURL
    status: done
    value: |
      採用主体は楽天グループ株式会社。対象は2026年10月入社・2027年4月入社向けビジネス職と、2027年入社向けエンジニア職。ビジネス職ページには「本選考エントリー受付中」の表示が残るが、締切は2026年4月21日8:59で確認日時点では経過。2027年入社向けエンジニア職は募集終了。2028年入社向け本選考は案内待ち、夏季インターンシップは全件募集終了。
      ビジネス職はビジネス総合、FinTech、デザイン、マーケティングの4コース。エンジニア職は一般カテゴリ8分類、2027年向けの詳細20組織×職種カード、カード内31サブポジション。楽天モバイル株式会社は別法人のため対象外。
    subject: 楽天グループ株式会社（楽天銀行・楽天ペイメント等のカードはグループ会社表記）
    as_of: 2026-08-05
    unit: 件 / 募集年度
    source: |
      https://corp.rakuten.co.jp/careers/graduates/
      https://corp.rakuten.co.jp/careers/graduates/recruit_business/
