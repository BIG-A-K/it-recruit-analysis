    note: ビジネス職トップの受付中表示と過去の締切日が併存する。楽天モバイル株式会社は募集者名が別法人で、楽天グループ株式会社の職種数・待遇へ混在させない。
  - id: recruit-jobs
    phase: recruit
    store: mdx
    topic: 職種ごとの仕事内容・応募資格・配属・選考区分・勤務地
    status: done
    value: |
      ビジネス総合コースは楽天グループの70以上のサービスに関わるコンサルティング営業、企画、マーケティング、クリエイティブ、人事・総務・法務・経理・財務などを対象とし、研修後に適性・希望を考慮して初期配属。FinTechコースは決済・カード・保険領域へ初期配属、デザインコースはデザイン・UX職へ初期配属、マーケティングコースはグループ全体のマーケティング・ブランド・メンバーシップ戦略へ初期配属。応募資格はコースごとに異なるが、国内外の大学・大学院卒業予定、新卒・既卒不問、就業経験3年未満可、ビジネスレベル以上の日本語が共通。ビジネス総合は2026年10月または2027年4月入社、他3コースは2027年4月入社。デザインはポートフォリオ、マーケティングは追加記述式設問が必要。
      ビジネス職の選考はPersonal Page登録、Application Form、Web Test、履修データ提出、オンライン面接、内定。コースにより選考ステップが異なる場合がある。
      エンジニア職の2027年向け詳細カードは全件募集終了。ソフトウェアはCommerce & Marketing、Technology Management、Technology Platforms、Rakuten Bank、Rakuten Paymentの5カード、インフラはTechnology Management、Technology PlatformsのCritical Facilities・Infra、Rakuten Bank、Rakuten Paymentの5カード、AI/MLはAI & DataのAI Engineer・Research Scientist、Technology PlatformsのMachine Learning Engineerの3カード、データはAI & DataとRakuten Paymentの2カード、プロダクト／プロジェクトマネージャーはCommerce & Marketing、AI & Data、Technology Management、Technology Platforms、Rakuten Paymentの5カード。初期勤務地は楽天クリムゾンハウス、東京都内オフィス、NBF品川タワー、新潟県長岡市内など。カード別にアプリ・インフラ・データ基盤・AI研究・決済・金融システム・プロダクト管理等の仕事内容と必須スキル、コーディングテスト有無が記載される。
      エンジニア共通の募集対象は2028年入社が可能で、学士・修士・博士を取得予定または取得済みの人。2028年正社員の具体的職種は未発表。
    subject: ビジネス4コースおよびエンジニア2027年入社向け20組織×職種カード
    as_of: 2026-08-05
    unit: コース / 職種カード
    source: |
