    資本関係で確定できたのは、株式会社DMM.com証券の議決権100%を株式会社DMM FXホールディングスが保有する点のみ（2026年3月期 業務及び財産の状況に関する説明書）。同社と DMMドリームクラブ株式会社 は公式グループ会社一覧に掲載がない。
    新卒採用は募集ページごとに主体表記が異なる（DMMグループ / EXNOA / DMMホールディングス）。合同会社EXNOA は別法人だが companies.csv には未登録で、本調査では company_id を新設していない。
