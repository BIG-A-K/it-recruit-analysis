    note: |
      売上4,287億円・会員数6,012万人・従業員5,184名はいずれも公式サイトの自主公表値であり、法定開示に基づく監査済みの連結数値ではない。連結範囲の注記も「DMM.com、DMM.com証券、DMM.com BASE、他連結（2月期）」のみで対象法人の全容は開示されていない。
