      ■休日休暇（エンジニア職／ゲームプラットフォームエンジニア職）
      完全週休2日制（土・日）、祝日、夏季休暇、年末年始休暇、年次有給休暇、慶弔休暇（年間休日120日以上）。

      ■応募期限
      ビジネス職: エントリーシート締切日 2026年8月16日（日）、2026年8月23日（日）。「締切日は順次追加いたしますが、採用人数が総定数に到達した場合など事前の予告なく早期に選考を終了する可能性がございます。」（2026-08-05時点で受付中）
      エンジニア職: 随時。
      ゲームプラットフォームエンジニア職: 随時／採用人数に達すると募集終了。
      財務経理職（2026年卒）: 2025年9月7日（日）で受付終了。2027年卒は未公開。
