  - id: article-mission
    phase: article
    store: mdx
    topic: 理念・ミッション・スローガン
    status: done
    value: |
      【コーポレートメッセージ】「誰もが見たくなる未来。」
      本文（公式表記）: 「人がみな失敗を恐れず、挑戦できる世界をつくる。そのために、私たちは存在したい。／年齢も、肩書きも、領域をも超えて、変化を恐れず、ひたむきに挑戦し続ける。／それが、誰も想像できない未来を、誰もが見たくなる未来に変えていくと信じて。」
      補足（公式）: 「コーポレートメッセージは、この創業以来変わらない私たちの個性を、これからもそうあり続けるという、未来への宣言です。DMM.（ドット）の先にある未来に向けて、これからも新しい領域への挑戦を続けていきます。」
      【組織風土＝DMM.ESSENCE】"DMMらしさ"を言語化した5つのエッセンス。(1)本気の失敗を肯定する。(2)テクノロジーとともに。(3)誠実であれ。(4)ちゃんと稼ぐこと。(5)好奇心を忘れない。
      【なぜ「なんでもやっている」のか（公式説明）】「DMMが『なんでもやっている』のは企業としての生存戦略。」立ち上げた事業のうち成功するのはわずか一握りで、社会や時代とともに事業も変化しなければ生き残り続けることは難しい、という説明が公式企業情報トップに掲げられている。
      【技術方針】「DMMのテックカンパニー化」というミッションのもと「DMM Tech Vision」を公開（/technology/）。
      【グループ会社の理念（参考）】合同会社EXNOA:「心と時代に残る、興奮を生みだす。」
    subject: 合同会社DMM.com／DMMグループ
    as_of: 2026-08-05（確認日）
    unit: ""
    source: https://dmm-corp.com/company/ ・ https://dmm-corp.com/recruit/workplace/philosophy/ ・ https://dmm-corp.com/technology/ ・ https://dmmgames.co.jp/company/
