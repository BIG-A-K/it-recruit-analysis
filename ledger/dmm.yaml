      株式会社DMM.com証券（設立2006年12月6日、資本金98億円＋資本準備金73.9億円、代表取締役 谷川龍二、関東財務局長(金商)第1629号）の株主は「株式会社DMM FXホールディングス」1名で議決権100.00%（2026年3月31日現在）。同社は合同会社DMMホールディングスから21,300百万円、株式会社DMM FXホールディングスから5,400百万円を借り入れている（2026年3月31日現在）。
