  - id: article-company
    phase: article
    store: mdx
    topic: 会社紹介（設立経緯・規模）
    status: done
    value: |
      【正式社名】合同会社DMM.com（英文表記は公式会社概要に記載なし）。持株会社は合同会社DMMホールディングス。
      【会社概要（公式・2025年2月時点）】設立 1999/11/17、資本金 1億1円、決算月 2月、従業員数 2,730名、会長 亀山敬司、事業内容「DMMサービス事業を統括」。
      本社: 〒106-6224 東京都港区六本木三丁目2番1号 住友不動産六本木グランドタワー24階。加賀事業所: 〒922-0551 石川県加賀市美岬町メ1-1。金沢事業所: 〒921-8044 石川県金沢市米泉町10丁目1-152。
      【設立経緯】石川県加賀市でレンタルビデオ店を5店舗展開していた亀山敬司が、国内外の競合と同じ土俵では勝てないと考え、黎明期のインターネットビジネスへ参入。1998年にビデオ通販・動画配信サイト（現・DMM TV）を立ち上げ、1999年に株式会社デジタルメディアマート（現・DMM.com）を設立した。亀山は1961年石川県生まれ、19歳でアクセサリー販売の露天商から起業家人生を開始している。
      【主な沿革】2003年 DMMレンタル／2009年 DMM FXリリース・株式会社DMM.com証券設立／2009年 AKB48 LIVE!! ON DEMAND／2011年 オンラインゲーム事業（現DMM GAMES）開始／2012年 ソーラー（エナジー）事業開始／2013年 DMM.make 3D PRINT・DMM英会話／2014年 DMM.make、DMM.make AKIBA、DMM.make ROBOTS／2016年 DMMオンラインサロン／2017年 グループ総売上2,000億円突破・STVV経営権取得・DMM BANUSY／2018年 会員数3,000万人突破、成人向け事業を株式会社デジタルコマースへ事業譲渡しDMM.R18はFANZAとして完全分離、チームラボ プラネッツ TOKYO開業、DMM VENTURES設立、株式会社インフラトップ買収／2019年 株式会社ベルリング買収、石川県内4事業所を移転統合、株式会社ファーマリー買収、42 Tokyo設立／2020年 DMMかりゆし水族館オープン、AlgoAgeと資本業務提携、DMMオンライン展示会／2021年 DMMブックスへ改称、アビスパ福岡の一部株式取得、DMMオンクレ設立（現在は合同会社DMM.comに吸収合併）、DMMオンラインクリニック／2022年 メタバース「Mid Mega City」始動、DMM TV・DMMプレミアム開始／2023年 株式会社Algomatic設立、DMM EV CHARGE（現DMM EV ON）開始、グループ総売上3,000億円突破。
      【規模（公式「数字で見るDMM」）】売上 4,287億円（DMM.com、DMM.com証券、DMM.com BASE、他連結／2月期）、会員数 6,012万人、事業数 60事業以上、グループ会社数 24社、従業員数 5,184名（グループ）。
      【人・働く環境（同上、主にDMM.comおよびEXNOA・2024年3月〜2025年2月）】男女比 女性36.9%／男性63.1%、社員国籍数27の国と地域・外国籍社員152名（2024年11月時点）、障がい者職場定着率85.6%、有給取得率74.0%（全国平均65.3%）、平均残業時間8.34時間、平均勤続年数5.5年、男性育休取得率88%、女性育休後復職率93%。
      【経営体制】会長 亀山敬司。2025年10月にカンパニー制へ移行し、PFカンパニーCEO 村中悠介、イノベーションカンパニーCEO 緒方悠、トレーディングカンパニーCEO 新藤大介。CTO 渡辺繁幸、CFO 粕谷佳宏、CCO兼CHRO 坂之上洋子、特別顧問 安藤隆春。
      【その他】マルチステークホルダー方針を2025年10月28日付で公表（合同会社DMM.com 会長 亀山敬司名義）。
    subject: 合同会社DMM.com（規模の一部はDMMグループ）
