  - id: recruit-jobs
    phase: recruit
    store: mdx
    topic: 職種ごとの仕事内容・応募資格・配属・選考区分・勤務地
    status: done
    value: |
      ■【2027年卒】ビジネス職（勤務地: 東京）
      5コース制。コンテンツコース=アニメ・映画・IPビジネス等の企画・営業・製作・プロデュース（DMM Pictures等）／ゲームコース=DMM GAMESをはじめとするゲーム・IP関連事業、新規IP創出とプラットフォーム成長／マーケティングコース=60以上の事業の成長をマーケティングで牽引／グローバルコース=グローバル視点での事業推進／総合コース=アニメ関連・ゲーム・マーケティングを除く幅広い事業。
      応募資格: 「2027年4月1日に入社可能な方。第二新卒の方もご応募いただけます。高校在学中の方はエントリーをせずにメールでお問い合わせください」。
      選考: エントリーシート→適性検査→グループディスカッション→面接（複数回）。基本オンライン、最終面接のみオフライン（交通費支給）。
      配属: ページ上に記載なし（コース選択制）。

      ■【2027年卒】エンジニア職（正社員／入社2027年4月1日）
      募集職種と受付状況: データエンジニア（アナリスト）=受付中（各事業部と連携し分析・施策立案・効果検証。SQL、Python、時系列分析、統計的因果推論、ベイズ統計）／インフラエンジニア=受付中（サーバー・ネットワークインフラの構築運用、動画配信インフラのオンプレミス中心の構築運用保守）／アプリエンジニア=受付終了／Webエンジニア（フロントエンド・サーバーサイド）=受付終了／データプラットフォームエンジニア=受付終了／SRE=受付終了。
      勤務地: 「東京本社 ※石川勤務も可能。希望する場合は勤務地選択で石川をご選択ください。」
      選考: 書類選考（スキルチェックシート）→一次面接（現場エンジニア）→二次面接（マネージャー・エンジニア）→人事面談→最終面接（VPoE）。
      応募資格: ページ上に「応募資格」欄の記載なし。
      備考: 「※DMM GAMESでもデータアナリストの求人があります」との導線あり。

      ■【2027年卒】ゲームプラットフォームエンジニア職（募集会社: EXNOA／正社員）
      仕事内容: DMM GAMESプラットフォームの開発・運用。スマートフォンアプリ・SDKまたはWindowsアプリの要件定義・設計・開発・運用。
      募集職種: Webエンジニア（フロントエンド）／アプリエンジニア／Webエンジニア（バックエンド）／インフラエンジニア=受付終了。
      応募資格: 「プログラム実装、開発経験（言語不問）」「サーバ構築経験」「対面及び文字ベースのチャットなどで、相手を尊重しつつ円滑なコミュニケーション」「5W1Hで簡潔に言語化し人を巻き込み動かす能力」。
      勤務地: 「東京本社（研修後は基本的に出社勤務となります）」。
      選考: 書類選考→一次面接（オンライン）→二次面接（オンライン）→就業インターンシップ→最終面接（オフライン、オンライン相談可）。

      ■財務経理職: 2027年卒の募集ページは公開範囲で確認できず。2026年卒ページ（所属会社「DMMホールディングス」、勤務地 東京本社、応募資格「簿記・会計の基礎知識を有し、入社時には日商簿記2級程度の知識が前提」、選考=エントリーシート・Web適性検査・面接（複数回））は受付終了。
