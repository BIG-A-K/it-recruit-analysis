      - DMM Bitcoin: 公式グループ会社一覧に掲載がなく、旧公式ドメイン bitcoin.dmm.com はDNS解決不能。SBIホールディングスの公式ニュースリリース（2024年12月25日）で口座・預かり資産のSBI VCトレードへの移管が案内されている。
      - FANZA（旧DMM.R18）: 2018年3月に成人向け事業を株式会社デジタルコマースへ事業譲渡し、合同会社DMM.comから完全分離済み（公式沿革に明記）。
      - 株式会社インフラトップ（DMM WEBCAMP、2018年11月買収）: 公式グループ会社一覧に掲載がなく、採用ページのリンク先 infratop.jp もDNS解決不能。現況は公式一次情報で確認できず。
