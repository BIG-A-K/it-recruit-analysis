      ■リモート勤務
      エンジニア職: 「リモートと出社のハイブリッド勤務となります。出社頻度は職種や部署によって異なるため、面談・面接を通じてご確認ください。」
      ゲームプラットフォームエンジニア職: 「東京本社（研修後は基本的に出社勤務となります）」。
      ビジネス職: 記載なし。

      ■標準労働時間
      エンジニア職: フレックスタイム制（コアタイム11:00～17:00・詳細は部署による）。
      ゲームプラットフォームエンジニア職: 同上、ただし一部部署は適用外。
