  - id: recruit-overview
    phase: recruit
    store: mdx
    topic: 採用主体・募集年度・確認日・募集ページURL
    status: done
    value: |
      採用主体はピクシブ株式会社（非上場・開示主体なし）。新卒採用トップ https://www.pixiv.co.jp/new-graduates/ に【27年度】と【28年度】の新卒募集要項が併記（2026-08-15確認）。最新は28年度で、エンジニア職・ビジネス職・プロダクトデザイナー職の3職種すべて「詳細を見る」として応募受付中。27年度はエンジニア職・プロダクトデザイナー職が引き続き公開中、ビジネス職は「募集終了」。各職種の詳細は公式サイトから直接リンクされるHRMOS上のピクシブ株式会社公式求人票で確認。28年度: エンジニア職=hrmos.co/pages/pixiv/jobs/22012028、ビジネス職=jobs/22022028、プロダクトデザイナー職=jobs/22032028。27年度: エンジニア職=jobs/2077291346542534670、プロダクトデザイナー職=jobs/2077291346542534677。
    subject: ピクシブ株式会社（新卒採用）
    as_of: 2026-08-15
    unit: ""
    source: https://www.pixiv.co.jp/new-graduates/（2026-08-15確認）
    via: 公式新卒採用トップおよび公式コーポレートサイトから各職種のHRMOS公式求人票へ直接確認
