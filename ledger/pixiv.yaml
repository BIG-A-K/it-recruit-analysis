  - id: segments-services
    phase: segments
    store: mdx
    topic: 事業区分ごとの具体的なサービス名・ブランド名・提供内容・運営法人
    status: done
    value: |
      公式サイト「事業情報」（https://www.pixiv.co.jp/service/）は3区分（インターネットサービス事業／クリエイタープラットフォーム／コンテンツプラットフォーム）の下に個別プロダクトを掲載。運営はすべてピクシブ株式会社（プレスリリース冒頭の「ピクシブ株式会社が運営する～」表記で確認）。
      主なサービス: pixiv（イラスト・マンガ・小説の投稿コミュニティ、2007年開始、累計登録ユーザー1億人=2023年12月自社調べ、ビジネスガイド2026年度版では約1億2500万人、作品総数1.7億超）、pixivコミック（作品10,600以上が無料、参加出版社12社）、pixivFANBOX（ファンによるクリエイター支援、累計支援金総額約990億円）、BOOTH（創作マーケットプレイス、月間アクティブユーザー約900万人）、pixivFACTORY（グッズ・同人誌のオンデマンド制作）、pixiv Sketch、pixivision（創作系メディア）、sensei（イラスト講座）、ピクシブ百科事典、ImageFlux（さくらインターネットと共同開発の画像変換配信クラウド）、VRoid Studio（3Dキャラクターメイカー、累計約728万DL）、VRoid Hub、Palcy（講談社と共同で企画・運営・開発するマンガアプリ）、pixivコミックインディーズ、pixiv ads（セルフサーブ型運用型広告）、pixivcoban（プリペイド電子マネー）、Pastela（タブレット向けペイントツール）、FANBOXプリント（コンビニ印刷、印刷代金の30%をクリエイターに還元）、VEAT（アバター ダンス動画アプリ）。
      終了済み: pixiv PAY（2020年12月終了）、ピクシブ文芸（2021年4月終了）、pixiv WAEN GALLERY（TWIN PLANETとの共同運営、2019年2月〜2024年11月）。
