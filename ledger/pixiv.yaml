  - id: recruit-job-roles
    phase: recruit
    store: mdx
    topic: 職種ごとの仕事内容・応募資格・配属・選考区分・勤務地
    status: done
    value: |
      【28年度新卒（最新年度）】3職種とも正社員・試用期間3ヶ月。応募要件は全職種共通で「卒業後3年以内の方（就業経験不問）」。
      (1) エンジニア職（jobs/22012028）: 新規事業開発、新機能提案・既存機能の改善・高速化、実装後の運営まで。区分はフロントエンド／バックエンド／インフラ／スマホアプリ／基盤（配信技術・認証認可基盤・決済基盤・広告開発）／データ／機械学習／3D・xR・Unity／デザインシステム／セキュリティ＋オープン募集。
      (2) ビジネス職（jobs/22022028）: サービスの企画・運営、ユーザー獲得、プロモーション、開発ディレクション。区分はプロダクトマネージャー／プランナー／アライアンス企画／出版社企画／アカウントプランナー（広告提案営業）／海外グロース戦略。
      (3) プロダクトデザイナー職（jobs/22032028）: プロダクト開発初期からの参画、UXリサーチ、デザインシステムを活用したUI設計、プロトタイピングと改善。必須スキルはアプリまたはウェブプロダクトのUX/UIデザイン経験（プロアマ不問）。
      【選考フロー】エンジニア職: 書類選考→一次面接→二次面接→選考インターン（平日5日間、日給16,000円支給）→最終面接（役員）→内定。ビジネス職・プロダクトデザイナー職: 書類選考→一次面接→（ビジネス職のみ二次面接）→選考インターン→最終面接（役員）→内定。
      【勤務地】全職種共通: 東京都渋谷区千駄ヶ谷4-23-5-6F（東京オフィス）。会社情報には福岡オフィス（福岡市博多区中洲4-6-12 プラート中洲6F）も記載。
      【27年度】エンジニア職・プロダクトデザイナー職は28年度と同一内容で確認。27年度ビジネス職は募集終了。
    subject: ピクシブ株式会社（28年度エンジニア職・ビジネス職・プロダクトデザイナー職、27年度エンジニア職・プロダクトデザイナー職）
