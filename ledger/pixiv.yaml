  - id: recruit-conditions
    phase: recruit
    store: mdx
    topic: 転勤・リモート勤務・標準労働時間・応募期限
    status: done
    value: |
      【労働時間（全職種共通）】フレックスタイム制（標準労働時間1日8時間）、コアタイム10:00〜15:00、フレキシブルタイム7:00〜10:00／15:00〜21:00。
      【転勤・勤務地変更・リモート】勤務地は東京都渋谷区千駄ヶ谷4-23-5-6F。変更の範囲は「当社拠点全般、ならびに自宅」と明記（当社拠点全般=東京・福岡オフィスへの配属変更の可能性、自宅=在宅勤務を含む）。フルリモート可否の個別規定は公式ページに記載なし。
      【休日】完全週休2日制（土曜・日曜）、祝日、年次有給休暇（初年度10日以上）、慶弔休暇、夏季休暇、年末年始休暇、積立休暇。
      【雇用形態・試用期間】正社員、試用期間3ヶ月。【加入保険】雇用・労災・厚生年金・健康保険。
      【応募期限】新卒採用トップページおよび全職種のHRMOS公式求人票のいずれにも応募期限・締切日の記載なし（全職種「応募する」ボタンが有効）。
