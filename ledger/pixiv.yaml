  - id: recruit-salary
    phase: recruit
    store: mdx
    topic: 基準給与・基礎給・固定時間外手当・賞与・諸手当・標準年収
    status: done
    value: |
      【28年度・27年度とも同一水準】
      エンジニア職: 月給370,000円〜（内訳: 基本給258,000円〜＋時間外勤務手当（月45時間分）及び深夜割増相当分（月45時間分）112,000円〜）。別途対象者に賞与／住宅手当を支給。格別のスキル・経験がある場合は相談に応じる。
      ビジネス職・プロダクトデザイナー職: 月給340,000円〜（内訳: 基本給236,000円〜＋時間外勤務手当（月45時間分）及び深夜割増相当分（月45時間分）104,000円〜）。別途対象者に賞与／住宅手当を支給。
      【評価制度（全職種共通）】昇給 年2回（1月・7月）、賞与 年1回（10月）※年により異なる。
      【諸手当（全職種共通）】交通費支給、住宅手当（32歳まで。会社から1.2km圏内50,000円/月、配偶者がいる場合はさらに50,000円/月）、子ども手当（扶養家族の子ども1人につき20,000円/月）、書籍購入制度（5,000円/月）、希望PC購入制度、コンディショニングケア制度、フリードリンク制度、育児・介護休業制度。
      【標準年収】求人票の給与見出しは「年収」だが数値は月給表記のみで、年収のモデル数値・標準年収の明示はなし。
    subject: ピクシブ株式会社（新卒採用: エンジニア職／ビジネス職・プロダクトデザイナー職）
