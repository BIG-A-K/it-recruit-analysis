    value: |
      ピクシブ株式会社は非上場で法定開示がなく、法定報告セグメントは存在しない（EDINET提出書類スキャンで0件）。公式サイトの事業区分とIR報告セグメントの対応表は作成不能であり、記事の事業区分は公式サイトの3区分（インターネットサービス事業／クリエイタープラットフォーム／コンテンツプラットフォーム）をそのまま使う。各プロダクトがどの区分に属するかはページ上で明示的に紐づいていないため独自の割り当てはしない。
