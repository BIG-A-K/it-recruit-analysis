  - id: verify-article
    phase: verify
    store: mdx
    topic: MDX構成・CSV参照・数値境界・テスト・ビルド
    status: done
    value: |
      CompanyOverview（accenture-japan）から採用情報・事業内容・SegmentRevenue（accenture-plc）・関連企業・HealthMetrics/FinancialHistory/MetricTrends（accenture-plc）の順で構成。EmploymentOverviewは日本法人の報告人的指標がないため省略。FinancialDataは未使用。US GAAP・USD・8月31日終了のAccenture plc連結値と、日本法人の採用主体・単体値の境界、3地理報告セグメント、Reinvention ServicesのFY2025後統合、Exhibit 21.1の有効開始日非開示を本文に記録。not_disclosedの指標は本文・空表へ転記せず、コンポーネントのreportedフィルタへ委譲。
    subject: site/src/pages/companies/accenture-japan.mdx
    as_of: 2026-08-07
    unit: structure・text・data
    source: sec-0001467373-25-000217; https://www.accenture.com/jp-ja/careers/life-at-accenture/entry-level; https://www.accenture.com/us-en/about/company/annual-report
    via: uv run pytest; npm --prefix site run build; git diff --check
    note: |
      Accenture対象の整合性確認は60 passed。npm --prefix site run buildはastro check 0 errors・0 warnings・0 hints、98ページ生成で成功。生成済みaccenture-japanページに空の指標タイル、空の棒グラフ、not_disclosed指標の表示はなし。FY2025流動比率は28,900,689,000 / 20,352,097,000 × 100 = 142.0%。キャッシュフロー3区分合計はFY2023 1,256,472,000 USD、FY2024 -3,994,299,000 USD、FY2025 6,506,415,000 USD。全体pytestは60 passed・3 failedで、失敗は既存のactive企業とページ集合の不一致、およびsite/src/pages/companies/tokyo-electron-device.mdxの欠落に起因する2つの整合性テスト。accenture-japan.mdxとは無関係。git diff --checkは成功。
