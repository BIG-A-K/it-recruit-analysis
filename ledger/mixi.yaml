    status: done
    value: 現行掲載は法務スペシャリスト（新卒・27卒）1件。契約法務、M&A・海外投資・AI・個人情報・知財相談、組織横断の法的スキーム構築。学歴不問、既卒・第二新卒・国外留学生可、法科大学院修了・弁護士資格等歓迎。エントリー→ES→複数回面接→内定。勤務地は渋谷本社。配属によりグループ会社支援・出向の可能性あり
    subject: 法務スペシャリスト（新卒・27卒）
    as_of: 2026-08-05
    unit: ""
