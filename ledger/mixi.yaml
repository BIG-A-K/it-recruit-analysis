    via: 公式職種ページ・FAQを確認
    note: 「管理系ジェネラリスト」は取消線で現行募集に含めない
  - id: recruit-salary
    phase: recruit
    store: mdx
    topic: 職種ごとの基準給与・基礎給・固定時間外手当・賞与・諸手当・標準年収
    status: done
    value: 一律初任給ではなくスキル・バリューに応じて個別の月収オファー。月給制で固定残業代40時間分とライフプラン手当を含む。年2回賞与、40時間超・深夜・休日分は追加支給。基礎給、固定時間外手当額、賞与額、標準年収は職種ページ非開示。新卒住宅手当は入社後3年間、渋谷オフィス5km圏内で月30,000円。転居補助、カフェテリア年240,000ポイントあり。FAQの初任給30万円〜は個別オファーと併記
    subject: 法務スペシャリストおよび新卒共通制度
    as_of: 2026-08-05
    unit: JPY/month・year
    source: https://mixigroup-recruit.mixi.co.jp/recruitment-category/13815/; https://mixigroup-recruit.mixi.co.jp/faq/?anchor=fresh; https://mixigroup-recruit.mixi.co.jp/life/welfare/
