    store: mdx
    topic: 転勤・リモート勤務・標準労働時間・応募期限
    status: done
    value: 所定労働10:00-19:00、休憩1時間、フレックス（5:00-22:00、コアなし）。完全週休2日・年間休日123日。勤務地は渋谷本社、会社規程に基づきリモート。マーブルワークスタイルでは部署・事業フェーズによりフルリモートや出社回数を選択、日本全国居住可、通勤費月15万円まで。現時点で転勤可能性なし。通年採用で基本締切なし、入社時期は2026年10月/2027年4月
