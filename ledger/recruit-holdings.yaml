  - id: article-mission
    phase: article
    store: mdx
    topic: 理念・ミッション・スローガン
    status: done
    value: 基本理念「私たちは、新しい価値の創造を通じ、社会からの期待に応え、一人ひとりが輝く豊かな世界の実現を目指す」。ビジョン「Follow Your Heart」。ミッション「まだ、ここにない、出会い。より速く、シンプルに、もっと近くに。」。バリュー3つ「新しい価値の創造(Wow the World)／個の尊重(Bet on Passion)／社会への貢献(Prioritize Social Value)」。経営戦略3つ「Simplify Hiring／Help Businesses Work Smarter／Prosper Together」
