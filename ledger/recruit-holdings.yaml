  - id: recruit-conditions
    phase: recruit
    store: mdx
    topic: 転勤・リモート勤務・標準労働時間・応募期限
    status: done
    value: 全コースで将来的に全配属先への配置転換・グループ内外への出向兼務の可能性あり。入社後原則グループ各社へ出向。ビジネスグロース勤務地は全国（海外含む）、他4コースは東京起点で将来的に海外含む。リモートワークは理由・回数を問わず全社導入、出社を前提としない（出社率43%、2025年3月末）。通勤費は出社分実費支給・1日上限5,000円。標準労働時間9:00-18:00・休憩60分（実労8時間）、フレックス制あり。年間休日140日・休み145日、有給消化率60%。応募期限：2026/4/1 13:00でエントリー受付終了済み
