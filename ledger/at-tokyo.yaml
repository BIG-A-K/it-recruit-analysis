    topic: 職種ごとの仕事内容・応募資格・配属・選考区分・勤務地
    status: done
    value: 新卒は3コース(総合職のみ、職種別採用ではない)。(1)事務系総合職=カスタマーサポート部門からキャリアスタートし顧客ニーズとビジネス成り立ちを学習、その後営業部門・管理系(人事・経理・法務等)へ複数回ジョブローテーション。(2)技術系総合職=電気・空調・通信・セキュリティ設備に対し設計/構築/施工/管理の各フェーズを担当。保全計画作成・作業管理・設備改善の検討〜実行。(3)情報系総合職=24時間365日のDC利用を支えるネットワークインフラエンジニア職と、顧客サーバーの消費電力・通信量等の稼働状況可視化・情報公開を行うシステム設計のデータエンジニア職。応募資格・選考プロセス・配属拠点の職種別明示は公式新卒ページに記載なし(マイナビ2027に委ねられている模様)。勤務地=本社(豊洲)のほか、センターは東京都内(23区・多摩)、大阪府内、福岡市内、札幌市内、広島市内、高松市内、沖縄県内に展開(個別センター所在地は「公表しておりません」と明示)。技術系・情報系は統合監視室での当直(シフト勤務)を含む
