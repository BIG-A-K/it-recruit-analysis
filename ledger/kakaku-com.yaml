    note: 採用充足時は受付中止の可能性
  - id: recruit-jobs
    phase: recruit
    store: mdx
    topic: 職種ごとの仕事内容・応募資格・配属・選考区分・勤務地
    status: done
    value: 事業開発は新規事業・組織マネジメント・M&A・事業成長、研修後インキュベーションカンパニー配属。ビジネスは営業・企画・Webディレクター・マーケティング、研修後配属。エンジニアはプロダクト開発・インフラ・生成AI、関連開発経験が必要。学歴/学部不問、既卒可、就業経験3年未満も対象。選考は書類・適性/技術試験・複数面接、勤務地は渋谷オフィス
    subject: 事業開発・ビジネス・エンジニア
    as_of: 2026-08-05
    unit: ""
    source: https://hrmos.co/pages/kakakucom/jobs/100000033; https://hrmos.co/pages/kakakucom/jobs/100000035; https://hrmos.co/pages/kakakucom/jobs/100000040
    via: 現行3職種の公式募集要項を個別確認
    note: ""
  - id: recruit-salary
    phase: recruit
    store: mdx
    topic: 職種ごとの基準給与・基礎給・固定時間外手当・賞与・諸手当・標準年収
    status: done
    value: 事業開発は年収550万〜650万円、基本給323,880円〜382,780円、固定残業88,620円〜104,720円。ビジネスは450万〜550万円、基本給264,980円〜323,880円、固定残業72,520円〜88,620円。エンジニアは450万〜650万円、基本給264,980円〜382,780円、固定残業72,520円〜104,720円。全職種固定残業35時間相当、超過分別途、賞与年1回。家族手当・在宅勤務環境手当
    subject: 2027年度新卒3職種
