    topic: 採用主体・募集年度・確認日・募集ページURL
    status: done
    value: 採用主体は株式会社カカクコム。2027年度新卒を通年受付、事業開発・ビジネス・エンジニアの3職種、入社月は4月/10月。公式 https://kakaku.com/info/recruit/ と新卒 https://kakaku.com/info/recruit/job/graduate.html
    subject: 新卒採用3職種
    as_of: 2026-08-05
    unit: ""
