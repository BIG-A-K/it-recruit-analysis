  - id: verify-article
    phase: verify
    store: mdx
    topic: MDX構成・CSV参照・数値境界・テスト・ビルド
    status: done
    value: |
      fanuc.mdxはテンプレート順のCompanyOverview、CompanyProse、EmploymentOverview、CompanyProse、HealthMetrics、FinancialHistory、MetricTrendsで構成。FinancialDataは未使用。法定報告セグメントは単一で、segments.csvがnot_disclosedのためSegmentRevenueは省略し、商品・サービス区分との差異と省略理由を本文に記録。採用主体・職種・勤務地・初任給・選考区分・待遇、公式出典リンク、財務の連結/単体・JGAAP・3月末の境界を確認。
    subject: site/src/pages/companies/fanuc.mdx
    as_of: 2026-08-07
    unit: ""
    source: edinet-s100yg3q; https://www.fanuc.co.jp/ja/employ/recruit/recruit/requirements/; https://www.fanuc.co.jp/ja/product/index.html
    via: uv run pytest; npm --prefix site run build; git diff --check
    note: |
      FANUC対象の整合性確認は60 passed。npm --prefix site run buildはastro check 0 errors・0 warnings・0 hints、97ページ生成で成功。生成済みfanucページに空の指標タイル、空の棒グラフ、セグメント売上の空表示はなし。流動比率689.3%、当座比率515.2%、ネットCFの3区分合計を再計算。全体pytestは60 passed・3 failedだが、失敗は既存のtokyo-electron-deviceページ不足、active企業とページ集合の不一致、dmmの未上場コンポーネント規約違反で、fanuc.mdxとは無関係。git diff --checkは成功。
