  company_relations: マクニカホールディングス株式会社が株式会社マクニカの100%親会社（純粋持株会社）。2015年4月1日の共同株式移転により設立。company_relations.csv に macnica→macnica-holdings(parent), valid_from=2015-04-01 を登録済み。
  note: 採用主体は事業会社「株式会社マクニカ」（横浜、設立1972年10月30日）、開示主体は持株会社「マクニカホールディングス株式会社」（東証プライム3132、EDINETコードE31167）。決算は3月期、会計基準はJGAAP。2015年4月1日の共同株式移転でマクニカHD設立（マクニカと富士エレクトロニクスを完全子会社化）。metrics/segments は company_id=macnica-holdings で登録し、採用主体 macnica へは親会社の連結数値を複写しない。
