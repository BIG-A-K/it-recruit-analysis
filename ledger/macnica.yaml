    note: 人的資本の平均値はマクニカHD単体（約42名）で、事業会社マクニカや連結全体（5,261名）ではない。平均年間給与16,285,818円はHD本体の高水準。記事の:::warningでスコープ差を明記。FY2026報告セグメント変更（ネットワーク事業→サイバーセキュリティ・その他ITソリューション）。edinet-normalizeがmacnica-holdingsを各種設定に含まないため一部をcsv-upsertで補完（改善候補）。
