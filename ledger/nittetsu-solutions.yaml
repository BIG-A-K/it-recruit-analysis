      単体従業員数（FY2026=4,102名）はXBRLに開示あるがCLIが連結のみ対象のため未採集。
  - id: recruit-conditions
    phase: recruit
    store: mdx
    topic: 採用主体・新卒職種・待遇・勤務地・選考
    status: done
    value: >
      日鉄ソリューションズ株式会社が新卒採用を直接実施。2027年3月卒対象。
      募集ページ: https://www.nssol.nipponsteel.com/recruiting/job/requirement/
      職種は総合職（配属は入社後に決定）で5部門：システムエンジニア・営業・研究開発・ITコンサルタント・経営管理。
      全学部全学科、文理比は例年理工8割/文科2割。
      初任給（2027年度予定・月給7.5時間所定労働・残業代別途）: 修士了320,000円・大学卒300,000円。賞与年2回・昇給年1回。
      諸手当: 通勤交通費・次世代育成支援手当・住宅手当（東京45,000円/名阪25,000円/その他19,000円）・独身寮（入社後3年上限）・持家支援手当。
      在宅勤務制度・フレックスタイム・短時間勤務制度あり。2024年度実績: リモートワーク比率57.4%・月間平均残業9.0時間・有給取得15.1日。
      休日: 完全週休2日制（土日）+祝日+年末年始、年間休日126日（2026年度）。
      非開示: 標準年収モデル・基礎給/固定残業代の内訳・転勤制度・新卒選考プロセス詳細・応募期限・初任配属地。
    subject: 日鉄ソリューションズ株式会社（新卒採用、2027年3月入社向け）
    as_of: 2026-08-06
    unit: JPY・日・percent
    source: nssol-recruit-requirement; nssol-recruit-faq; nssol-recruit-welfare; nssol-recruit-infographics
    via: 公式採用サイトの新卒ページ群を直接確認
    note: >
      募集要項ページでは全職種を総合職として一括募集。初任配属選択コース・年俸契約型新卒社員制度は名称のみ記載で詳細はお問合せ扱い。
      28年卒はプレエントリー段階のみ。
  - id: segments-services
    phase: segments
    store: mdx
    topic: 報告セグメントの事業内容と公式サービス領域の対応
    status: done
    value: >
      会社概要の事業内容はシステムインテグレーション一事業。有報は単一報告セグメント「情報サービス」。
      公式サイトの事業区分（/ss/）は報告セグメントではなく顧客業種別・技術別の分類。
      業種別: 製造・消費財/流通/金融/ネット・サービス業/公共・公益/通信。
      技術・領域別: DX/AI/ローカル5G/データ活用/IoT/モダナイゼーション/アウトソーシング/インソーシング/グローバル。
      社内組織8ユニット: デジタルソリューション＆コンサルティング本部/産業ソリューション事業本部(PLANETARY)/流通・サービスソリューション事業本部/金融ソリューション事業本部(Enepharos)/ITサービス&エンジニアリング事業本部(M³DaaS@absonne/NSFITOS/NSSEINT)/鉄鋼ソリューション事業本部(日本製鉄グループ向け・全売上の2割弱)/システム研究開発センター/グローバルビジネス支援センター。
    subject: 連結報告セグメント
    as_of: 2026-08-06
    unit: ""
    source: corporate-overview; ss-top; recruiting-business; ir-securities
    via: webfetch（corporate/recruiting/IR 各種HTMLページを直接取得）
    note: 公式事業区分（業種別・技術別）は報告セグメントではなく単一SI事業内の顧客区分・技術区分。
  - id: segments-related-companies
    phase: segments
    store: mdx
    topic: 主な子会社・関連企業の具体名・事業内容・報告セグメント
    status: done
    value: >
      親会社: 日本製鉄株式会社（東証プライム・鉄鋼）。2012年10月新日鉄住金ソリューションズへ商号変更、2019年4月現商号へ。
      国内連結子会社: 日鉄ソリューションズ北海道/東日本/中部/関西/九州/沖縄、インフォコム（医療ERP）、サービスアンドテクノロジー（ITインフラ・DC）、ネットワークバリューコンポネンツ（NW・セキュリティ）、NSフィナンシャルマネジメントコンサルティング、金融エンジニアリング・グループ、B-Prost、Act.。
      合弁: 日鉄日立システムソリューションズ、エヌシーアイ総合システム。
      海外: 日鉄軟件（上海）、NS Solutions Asia Pacific（シンガポール）、Thai NS Solutions（タイ）、PT. NSSOL SYSTEMS INDONESIA、PT. WCS ABYAKTA NAWASENA、NS Solutions USA（San Mateo）、NS Solutions IT Consulting Europe（英国）。
    subject: 連結子会社・関連会社・親会社
    as_of: 2026-08-06
    unit: ""
    source: corporate-relation; recruiting-group; corporate-history
    via: webfetch（corporateサイト・採用サイトのHTMLを直接取得）
    note: 親会社（日本製鉄）は本データセットではcompany_relations.csvへ未登録。
