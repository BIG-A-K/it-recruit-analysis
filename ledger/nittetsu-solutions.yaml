    store: ir_csv
    topic: 平均年間給与・平均年齢・平均勤続年数・従業員数
    status: done
    value: metrics.csv: average_annual_salary/average_age/average_tenure（non_consolidated FY2023-FY2026 各4行）+ employee_count（consolidated FY2019-FY2026 8行）= 計20行
    subject: 提出会社単体（給与・年齢・勤続）・連結（従業員数）
