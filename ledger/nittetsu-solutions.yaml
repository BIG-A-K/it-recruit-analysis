    phase: article
    store: mdx
    topic: 企業理念・会社紹介・公式リンク・会計基準
    status: done
    value: >
      企業理念「創造・信頼・成長」。パーパス「ともに未来を考え、社会の新たな可能性をテクノロジーと情熱で切り拓く」。
      ビジョン「NSSOL 2030ビジョン: Social Value Producer with Digital」。コーポレートメッセージ「ともに、その先の答えを」。
      設立: 1980年10月1日（日鐵コンピュータシステムとして設立）。2002年10月東証一部上場、2022年4月プライム移行。
      規模（2026年3月期・連結）: 資本金129億5,276万円・売上3,813億円・従業員10,276名。本社: 東京都港区虎ノ門。
