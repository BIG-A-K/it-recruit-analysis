  - id: ir-financial-history
    phase: ir
    store: ir_csv
    topic: 売上高・営業利益・キャッシュフロー・自己資本比率 3期以上
    status: done
    value: metrics.csv 連結IFRS: revenue/operating_profit/operating_cf/investing_cf/financing_cf FY2022-FY2026（各5行）+ equity_ratio FY2021-FY2026（6行）= 計31行
    subject: 連結
    as_of: 2021-03-31〜2026-03-31
    unit: JPY・percent
    source: edinet-s100yaev; edinet-s100vy52; edinet-s100to3m; edinet-s100r04v
    via: edinet-fetch --all（4期取得）+ edinet-normalize ×4
    note: >
      FY2026売上381,340百万円・営業利益44,242百万円・自己資本比率66.9%は公式値と一致。
      FY2025投資CF +70,249百万円（正値）は大型投資回収等によるもの。FY2026営業CF -3,409百万円は要注記。
