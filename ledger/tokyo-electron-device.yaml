    value: "【公式管理区分3区分】IR「3つの事業と当社の強み」とVISION2030で使用。2025年3月期売上構成比: EC事業82.7% / CN事業17.3% / PB事業6.8%。1.EC事業（半導体及び電子デバイス事業）、2.CN事業（コンピュータシステム関連事業）、3.PB事業（プライベートブランド事業 inrevium）。【法定報告セグメント2区分】有報ベース。公式/ir/business.htmlの明示「セグメント報告区分では、PB事業はEC事業に含まれています」。1.半導体及び電子デバイス事業（EC+PB）、2.コンピュータシステム関連事業（CN）。【差異】PBは戦略上は独立事業だがセグメント報告ではECに統合。MDX記事では管理上3事業（EC/CN/PB）を展開するが有報の報告セグメントは2区分（ECにPBを含む/CN）と併記が必要。VISION2030の売上構成比/営業利益率目標（CN15%/12%、EC75%/7%、PB10%/10%、全体ROE20%以上・営業利益率8%以上・売上高3,000〜3,500億円）は管理区分ベースでありsegments.csvの法定セグメント数値とは一致しない。"
    subject: 公式管理区分3（EC/CN/PB）↔ 法定報告セグメント2（EC+PB統合/CN）
