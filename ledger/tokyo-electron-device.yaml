    status: done
    value: "【正式社名】東京エレクトロンデバイス株式会社（登記上。定款上は「東京エレクトロン デバイス株式会社」、英称TOKYO ELECTRON DEVICE LIMITED、略称TED/東エレデバ）。【上場】東京証券取引所プライム市場（証券コード2760）。2003年3月市場二部上場、2010年12月市場一部指定替え、2022年4月市場区分見直しによりプライム市場へ移行。JPX日経インデックス400・JPX日経中小型株指数構成銘柄。【設立】1986年（昭和61年）3月3日（テル管理サービス株式会社として東京エレクトロン（株）の出資で設立）。1990年9月に現社名へ変更。【創業と沿革】1965年に親会社東京エレクトロン（株）で電子部品（フェアチャイルド社等）の販売を開始したことに始まる。1998年7月に東京エレクトロン（株）から電子部品部門の全事業を営業譲受け。2004年6月に自社ブランド「inrevium」を創業し製造メーカー機能を追加。2006年10月に東京エレクトロン（株）からコンピュータ・ネットワーク事業を承継。これにより現在のEC/CN/PB 3事業体制が完成。【代表者】代表執行役員・CEO 徳重 敦之、代表執行役員副社長 宮本 隆義（2026年7月1日現在）。指名委員会等設置会社。【本社】〒150-6234 東京都渋谷区桜丘町1番1号 渋谷サクラステージ SHIBUYAタワー。【規模（2026年3月期）】連結売上高2,037億4,800万円、連結従業員数1,408名（2026年3月31日現在）。資本金24億9,575万円、決算期3月31日、会計監査人有限責任あずさ監査法人。【事業構造】EC（半導体・電子部品販売）、CN（IT/ネットワークソリューション）、PB（自社ブランドinrevium）の3事業を展開する「技術商社機能を持つメーカー」。取り扱いメーカー約70社、取引顧客2,000社以上。【特徴】親会社東京エレクトロン（株）（証券コード8035）は半導体製造装置メーカー（別法人・別事業ドメイン）。当社は同グループ内で技術商社として独立上場する唯一の企業。"
    subject: 東京エレクトロンデバイス株式会社
