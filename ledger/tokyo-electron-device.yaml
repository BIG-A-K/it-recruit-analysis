    status: done
    value: "【企業スローガン（HPメインビジュアル）】DRIVING DIGITAL TRANSFORMATION。【HPメインメッセージ】デジタルトランスフォーメーションを実現する製品・サービスを提供し高効率スマート社会の持続的発展に貢献してまいります。【中期経営計画VISION2030（対象期間2026年3月期〜2030年3月期）】MISSION: 当社はITを中心とした先端テクノロジーを通じて、社会課題に向き合い、期待を超える価値を持った情報を提供することで、社会の持続的発展に貢献する。VISION: メーカーと技術商社の力で、持続的な社会課題を解決する。当社グループは「メーカー・カンパニー」と「技術商社カンパニー」の両輪で課題解決を行っていく。【採用サイトメッセージ】挑戦すること。逃げないこと。そして、明日を信じること。【渋谷本社オフィスコンセプト】Meets Innovation。【自己定義】「技術商社機能を持つメーカー」（VISION2025から、VISION2030ではメーカー・カンパニーと技術商社カンパニーの両輪へ強化）。"
    subject: 東京エレクトロンデバイス株式会社
