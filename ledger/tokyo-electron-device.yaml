    via: FY2026有報の注記テキストブロックを精査。
    note: "【未適用の会計基準】リース会計基準（企業会計基準第34号 2024年9月13日）ほか。2028年3月期の期首より適用予定、影響額は評価中。【表示方法の変更・組替え】(1)連結B/S: 有形固定資産のその他に含めていたリース資産を金額重要性増大で独立掲記。流動負債のその他に含めていた未払法人税等を独立掲記。(2)連結P/L: 営業外収益/費用のその他の受取保証料・保険配当金・支払保証料を独立掲記（10%超）。【連結範囲・組織再編】スミックス（株）を株式取得で子会社化したが総資産・売上高・当期純損益等いずれも軽微として連結範囲から除外。持分法適用関連会社は日本サンテック（株）1社（決算日12月31日）。Fidus Systems Inc.は株式全部売却で関連会社から除外。【会計基準】JGAAP。監査法人=有限責任あずさ監査法人。【主要株主】東京エレクトロン（株）10,598,100株（33.82%）が筆頭、2位 日本マスタートラスト信託銀行（信託口）7.80%、3位 東京エレクトロンデバイス社員持株会5.70%。親会社東京エレクトロンは持分法非適用。"
