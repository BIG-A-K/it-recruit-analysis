  - id: segments-services
    phase: segments
    store: mdx
    topic: 報告セグメントごとのサービス・製品・運営法人
    status: done
    value: "【法定報告セグメント2区分】IR「3つの事業と当社の強み」でPB事業はEC事業に含むと明示。(1)半導体及び電子デバイス事業（EC+PB統合）: ECは海外メーカーの半導体製品・ボード・電子部品・ソフトウェア・サービスの仕入販売と技術サポート。取り扱いメーカー40社以上（Texas Instruments、Infineon、NXP、Intel、Qualcomm、ソシオネクスト、アットマークテクノ、アバールデータ、サイレックス、Lattice、MaxLinear、Everspin、ams-OSRAM、SanDisk、Rochester Electronics、JVCケンウッド、日本電気、ハギワラソリューションズ等）。事業所は本社（渋谷サクラステージ）と全国14拠点。PB（自社ブランドinrevium、2004年6月創業）はFPGA/SoC評価ボード、量産モジュール・IPコア、設計・量産受託（DMS）、画像処理ライブラリ（WIL/FIE/FAST Vision）・画像処理装置（FVシリーズ）、ウェハ欠陥検査装置（RAYSENS: Si/SiC/LT-LN/ガラスウェーハ・マスクブランクス）、フラットパネル検査装置、予知保全（CX-M/CX-D）、ロボティクス（TriMath、めばかり君）。2023年10月に日本エレクトロセンサリデバイス（株）からウェーハ検査装置事業を譲受。専用サイト https://www.inrevium.com/ 。(2)コンピュータシステム関連事業（CN）: 2006年10月に東京エレクトロン（株）からコンピュータ・ネットワーク事業を承継。NW関連・ストレージ関連・セキュリティ関連製品の販売と保守・監視サービス。専用サイト https://cn.teldevice.co.jp/ の取り扱いメーカー30社以上（AWS、Arista、Juniper Apstra、Fortinet、Palo Alto、F5、Netskope、Nutanix、Pure Storage、Rubrik、SentinelOne、Veeam、Okta、NVIDIA、Dell Technologies、Extreme、Infoblox、Thales、Entrust、Wiz、Pentera、Cerebras、Datadog、Semperis、Glean、Exa Enterprise AI等）。SOCサービス（24時間365日）、クラウドインテグレーション、保守サポート。"
    subject: 連結報告セグメント（tokyo-electron-device）
    as_of: 2026-08-07（事業構成は2025年3月期実績比・VISION2030対象期間2026年3月期〜2030年3月期）
    unit: text
    source: https://www.teldevice.co.jp/ir/business.html, https://www.teldevice.co.jp/ir/action.html, https://www.teldevice.co.jp/semiconductor/, https://cn.teldevice.co.jp/, https://www.inrevium.com/
    via: 公式IR「3つの事業と当社の強み」、中期経営計画VISION2030、各事業サイトを取得。
    note: 公式管理区分は3（EC/CN/PB）、法定報告セグメントは2（EC+PB統合/CN）。差異はsegments-mappingに記録。
