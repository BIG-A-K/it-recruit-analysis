  - id: recruit-jobs
    phase: recruit
    store: mdx
    topic: 職種ごとの仕事内容・応募資格・配属・選考区分・勤務地
    status: done
    value: "募集職種は総合職1職種で事業（EC/CN/PB）ごとにコース構成。【営業系】ソリューションセールス（EC: 製品開発課題を聞き取り提案、CN: サーバー・ストレージ・NW製品を企業ITインフラに提案）。【技術系】(1)製品担当エンジニア（半導体電子デバイス・ITソリューションの技術提案・支援）、(2)設計開発エンジニア（PB事業でプライベート商品や受託開発の仕様検討〜回路・ソフト設計・マネジメント、IoT・AIも）。【事務系】企画（人事・総務・財務・営業管理・法務知財・情報システム・広報・物流）。応募資格: 全学部全学科、2026年3月卒業予定者または既卒者（卒業後3年以内）、普通自動車第一種免許を取得または入社までに取得予定。配属: 本社（渋谷区）とエンジニアリングセンター（横浜市都筑区）へ集約配属が多い。選考: 自由応募（マイナビ2027でプレエントリー）。選考フロー: プレエントリー→会社説明会→動画選考（自己PR動画+WEBエントリーシート）→1次面接→2次適性検査→3次面接→最終面接→内定。勤務地: 入社時は本社（東京都渋谷区）とエンジニアリングセンター（神奈川県横浜市都筑区）が主。"
    subject: 総合職（営業系ソリューションセールス／技術系 製品担当エンジニア・設計開発エンジニア／事務系 企画）
    as_of: 2026-08-07
    unit: ""
    source: https://www.teldevice.co.jp/recruit/information/, https://www.teldevice.co.jp/recruit/job/, https://www.teldevice.co.jp/recruit/faq/
    via: 公式募集要項・仕事詳細・FAQを取得し照合。
    note: 募集職種は総合職1職種に集約。仕事内容は事業セグメント（EC: 半導体及び電子デバイス、CN: コンピュータシステム関連、PB: プライベートブランド、管理部門）ごとに案内。
