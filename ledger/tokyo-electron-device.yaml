    phase: recruit
    store: mdx
    topic: 職種ごとの給与・賞与・手当・標準年収
    status: done
    value: "初任給（総合職・全コース共通、月給）＝基本給＋地域手当（東京・神奈川勤務）の合計額。修士了 300,200円（借上単身者用社宅制度適用なし）／252,200円（同適用の場合）。大卒 285,000円（同社宅制度適用なし）／237,000円（同適用の場合）。諸手当: 地域手当・時間外勤務手当・通勤手当（実費支給）。地域手当は勤務地および社宅制度適用有無により31,000円〜79,000円を毎月支給。昇給: 年1回。賞与: 年2回（6月・12月）。基本給と地域手当の内訳、固定時間外手当、標準年収は非開示。"
    subject: 総合職（全コース共通）
    as_of: 2026-08-07
    unit: JPY
    source: https://www.teldevice.co.jp/recruit/information/
    via: 公式募集要項の初任給・諸手当・昇給・賞与欄を取得。仕事詳細・FAQ・制度ページにも給与額の記載なしを確認。
    note: "公式は初任給を基本給+地域手当の合計額として開示。基本給単独・固定時間外手当・賞与月額・標準年収はnot_disclosed（全ページに記載なし）。借上単身者用社宅制度の適用有無で月額が約4.8万円異なる2本立て表記。"
  - id: recruit-conditions
    phase: recruit
    store: mdx
    topic: 転勤・リモート勤務・標準労働時間・応募期限
    status: done
    value: "転勤: 総合職は住居の移転を伴う転勤の可能性あり（FAQ明記）。全国転勤の可能性のある総合職採用社員に限り借上独身者用社宅制度を適用。転勤時は転居費用・住宅補助などサポート制度あり。リモート勤務: 公式募集要項・FAQ・制度・福利厚生のいずれにも記載なし。標準労働時間: 9:00〜17:30（勤務時間は配属先により異なる）。応募期限: 公式募集要項に明示なし。マイナビでプレエントリー受付中、会社説明会は順次開催（渋谷・大阪・オンライン）。休日休暇: 完全週休2日制（土・日）・祝日・年末年始。年次有給休暇は初年度15日（4月入社）、最高20日。リフレッシュ休暇（勤続5年毎に最長1ヶ月）。"
    subject: 総合職（全コース共通）
    as_of: 2026-08-07
    unit: ""
    source: https://www.teldevice.co.jp/recruit/information/, https://www.teldevice.co.jp/recruit/faq/, https://www.teldevice.co.jp/recruit/benefit/
    via: 公式募集要項・FAQ・制度福利厚生を取得。リモート勤務は3ページすべてに記載なしを確認。
