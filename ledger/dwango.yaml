      公式サイトの事業案内は8区分（https://dwango.co.jp/business/）。(1) ウェブサービス: ニコニコ（動画・生放送）、バーチャルキャスト（VR、子会社㈱バーチャルキャスト運営）、sheeta、ドワンゴジェイピー、animelo mix、ドワンゴジェイピーストア、大相撲公式アプリ。(2) クリエイターサポート: ボカロP・踊り手・歌い手・絵師等への音楽原盤・出版、エージェント、キャスティング。(3) イベント: ニコニコ超会議（2012年開始・17万人来場）、超歌舞伎、ニコニコ町会議、池袋ハロウィンコスプレフェス、The VOCALOID Collection、アニメロサマーライブ（2005年開始）、超声優祭、Splatoon甲子園、VTuberFesJapan。(4) 教育サービス: 学校法人角川ドワンゴ学園のN/S/R高等学校（コンテンツ制作・サービス開発）、学習アプリZEN Study、子会社㈱バンタン、ZEN Travel。(5) ゲーム: ＃コンパス（NHN PlayArtと共同開発・運営）、子会社㈱スパイク・チュンソフト（ダンガンロンパ/風来のシレン等）。(6) 電子書籍関連サービス: BOOK☆WALKER（2025年4月の㈱ブックウォーカー吸収合併によりドワンゴ直轄、170万点以上）、ニコニコ漫画、読書メーター、dマガジン・dブックのシステム開発・運用、カドコミ・コロナEXの開発・運用。(7) 電子書籍取次事業: 出版社と電子書籍ストア間の流通、国内50以上の取次先+海外直接取次（KADOKAWAグループ運営の北米・台湾ストア、Amazon、Google Play等）。(8) 技術・開発: Dwango Media Village（機械学習研究開発）、KADOKAWAグループ向けWebメディア開発・エンタープライズシステム構築、EUC、データエンジニアリング、ハイブリッドクラウド、QRouton。
      ニコニコ・イベント・モバイル配信・電子書籍・技術開発はドワンゴ直轄、バーチャルキャスト・バンタン・スパイク・チュンソフトは子会社が運営主体。
