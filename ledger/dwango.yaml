  note: |
    ドワンゴは非上場で自身の法定開示がない。EDINET提出書類スキャン（2025年・2026年の有報提出期、2025-05-20〜2025-07-20 および 2026-05-20〜2026-07-20 の営業日全部）で株式会社ドワンゴの提出書類は0件、株式会社KADOKAWA（E30731）の有報のみを確認（2026-06-23提出 S100YGF5 第12期 2026/3期、2025-06-25提出 S100W3PV 第11期 2025/3期）。
    ユーザー承認（2026-08-15）により開示主体をKADOKAWAとする（AWSジャパン→Amazon.comと同じ親会社開示パターン）。KADOKAWA連結の数値はcompany_id=kadokawaでCSVへ保存し、ドワンゴへ複写しない。
    KADOKAWA・ドワンゴの資本関係（2014年10月の経営統合以降、KADOKAWAがドワンゴの親会社）の有効開始日はKADOKAWA有報の沿革・主要な子会社記載で確認してからcompany_relations.csvへ反映する。
