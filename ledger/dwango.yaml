      会社概要（公式値、2026-08-15確認）: 正式名称 株式会社ドワンゴ／代表者 代表取締役社長 夏野剛／設立 1997年8月／資本金 1億円／本社 〒104-0061 東京都中央区銀座4-12-15 歌舞伎座タワー／事業内容 ネットワークエンタテインメントコンテンツ及びシステムの企画、開発、運用、サポート、コンサルティング。
      沿革の要点: 1997年8月設立（ネットワークゲームのシステム企画・開発等）。1999年11月「ドワンゴかもね」、2001年6月着メロ「16メロミックス（現dwango.jp）」で着メロ最大手級に。2003年7月東証マザーズ上場、2004年9月東証一部へ。2006年12月ニコニコ動画開始。2012年4月ニコニコ超会議初開催。2014年10月KADOKAWAと経営統合で上場廃止・グループ入り。2016年4月N高等学校開校・N予備校開始。2018年4月バーチャルキャスト開始。2025年4月ブックウォーカー・KADOKAWA Connectedを吸収合併。
