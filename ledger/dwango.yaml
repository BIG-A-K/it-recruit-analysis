    ドワンゴは非上場で自身の法定開示がない。EDINET提出書類スキャン（2025年・2026年の有報提出期、営業日計88日）で株式会社ドワンゴの提出書類は0件、株式会社KADOKAWA（E30731）の有報のみ（2026-06-23提出 S100YGF5 第12期、2025-06-25提出 S100W3PV、2024-07-31提出 S100U4MI）。
    ユーザー承認（2026-08-15）により開示主体をKADOKAWAとする（AWSジャパン→Amazon.comと同じ親会社開示パターン）。KADOKAWA連結の数値はcompany_id=kadokawaでCSVへ保存し、ドワンゴへ複写しない。
    KADOKAWA有報（S100YGF5）沿革: 2014年10月 株式移転により共同持株会社㈱KADOKAWA・DWANGO設立→ドワンゴが子会社に。2019年7月 旧㈱KADOKAWA全事業を吸収分割承継し商号を㈱KADOKAWAに変更。関係会社の状況: ドワンゴは議決権100.0%の連結子会社、連結売上高に占める割合が10%超のため主要な損益情報を開示（売上高48,981百万円・経常利益6,703百万円・当期純利益6,542百万円・純資産25,729百万円・総資産61,815百万円、2026年3月期）。この数値はドワンゴ単体に近い法定開示値として記事に使える。
    2025年4月1日付で㈱ドワンゴを存続会社とし㈱ブックウォーカー・㈱KADOKAWA Connectedを吸収合併（ドワンゴグループ内再編）。
