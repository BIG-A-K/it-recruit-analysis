  - id: segments-official-vs-ir
    phase: segments
    store: mdx
    topic: 公式サイトの事業区分とKADOKAWAのIR報告セグメントの対応関係と差異
    status: done
    value: |
      ドワンゴは非上場で自身の報告セグメントなし。KADOKAWAの報告セグメント（有報で確定: 出版・IP創出／アニメ・実写映像／ゲーム／Webサービス／教育・EdTech＋その他）との対応:
      - ウェブサービス、クリエイターサポート、イベント、電子書籍関連サービス、電子書籍取次事業、技術・開発 → Webサービス（KADOKAWAグループポータルのWebサービスページに「主なグループ会社 株式会社ドワンゴ」としてニコニコ・イベント・BOOK☆WALKER等が明記）
      - 教育サービス（バンタン、ZEN Study等） → 教育・EdTech
      - ゲーム（スパイク・チュンソフト、#コンパス） → ゲーム
      差異: ドワンゴ公式8区分はサービス提供形態別の顧客向け分類で、KADOKAWAの法定報告セグメントとは粒度・体系が異なる。ドワンゴの事業の大半はKADOKAWAの「Webサービス」セグメントに相当するが、教育とゲームは別区分にまたがる（KADOKAWA有報の関係会社表でもドワンゴは「出版・IP創出／Webサービス／教育・EdTech／その他」にまたがる会社として記載）。
