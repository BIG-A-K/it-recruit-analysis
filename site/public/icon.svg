<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="企業分析サイトのアイコン">
  <defs>
    <linearGradient id="bar-blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <style>
    /* fill-box 基準にしないと、各図形の足元を軸に伸縮できない */
    .bar, .mascot, .eye, .sparkle { transform-box: fill-box; }
    .bar { transform-origin: 50% 100%; animation: pop 3.2s ease-in-out infinite; }
    .bar-2 { animation-delay: .16s; }
    .mascot { transform-origin: 50% 100%; animation: bob 3.2s ease-in-out infinite; animation-delay: .32s; }
    .eye { transform-origin: 50% 50%; animation: blink 5.4s ease-in-out infinite; }
    .sparkle { transform-origin: 50% 50%; animation: twinkle 3.2s ease-in-out infinite; }

    @keyframes pop {
      0%, 62%, 100% { transform: scaleY(1); }
      16%           { transform: scaleY(1.08); }
      36%           { transform: scaleY(.97); }
    }
    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-1.6px); }
    }
    @keyframes blink {
      0%, 92%, 100% { transform: scaleY(1); }
      95%           { transform: scaleY(.1); }
    }
    @keyframes twinkle {
      0%, 100% { opacity: .3; transform: scale(.7); }
      50%      { opacity: 1;  transform: scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      .bar, .mascot, .eye, .sparkle { animation: none; }
    }
  </style>

  <rect x="2" y="2" width="60" height="60" rx="16" fill="#ffffff"/>
  <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="15.25" fill="none" stroke="#dbe4f0" stroke-width="1.5"/>
  <line x1="10" y1="50.8" x2="54" y2="50.8" stroke="#e4e8ee" stroke-width="1.8" stroke-linecap="round"/>

  <rect class="bar bar-1" x="11" y="38" width="8" height="12" rx="4" fill="#bfdbfe"/>
  <rect class="bar bar-2" x="23" y="30" width="8" height="20" rx="4" fill="#7dabf8"/>

  <g class="mascot">
    <rect x="35" y="20" width="18" height="30" rx="9" fill="url(#bar-blue)"/>
    <ellipse class="eye" cx="40.6" cy="31.4" rx="2.1" ry="2.4" fill="#ffffff"/>
    <ellipse class="eye" cx="47.4" cy="31.4" rx="2.1" ry="2.4" fill="#ffffff"/>
    <ellipse cx="37.7" cy="35.4" rx="1.7" ry="1.2" fill="#fda4af" opacity=".65"/>
    <ellipse cx="50.3" cy="35.4" rx="1.7" ry="1.2" fill="#fda4af" opacity=".65"/>
    <path d="M41.5 36.3q2.5 2.5 5 0" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <path class="sparkle" d="M53.5 9.5 55 13l3.5 1.5L55 16l-1.5 3.5L52 16l-3.5-1.5L52 13z" fill="#fbbf24"/>
</svg>
